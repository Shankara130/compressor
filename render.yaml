# Render Blueprint — one-click deploy.
# Docs: https://render.com/docs/blueprint-spec
#
# How to use:
#   1. Push this repo to GitHub (Dockerfile must be committed).
#   2. On Render: New > Blueprint > connect this repo.
#   3. Render reads this file and creates the web service for you.
services:
  - type: web
    name: compressor
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    # App exposes /health (returns 200). Render uses it to know when the
    # container is ready and to restart on failure.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Cap background workers; Render's free instance has limited CPU.
      - key: WORKER_COUNT
        value: "2"
