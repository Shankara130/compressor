<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COMPRESSOR // SHRINK YOUR FILES</title>
    <link rel="stylesheet" href="/static/style.css?v=2" />
  </head>
  <body>
    <main class="container">
      <!-- Header -->
      <header class="header">
        <div class="logo">
          <div class="logo-mark">C</div>
          <h1>Compressor</h1>
        </div>
        <p class="subtitle">// Optimize files without losing quality</p>
      </header>

      <!-- Upload Form -->
      <form id="uploadForm">
        <div class="dropzone" id="dropzone">
          <div class="dropzone-mark">[ + ]</div>
          <p class="dropzone-text">Drop file here</p>
          <span class="dropzone-subtext">or click to browse</span>
          <input type="file" name="file" hidden required />

          <!-- Selected file display -->
          <div class="file-info" id="fileInfo" style="display: none">
            <div class="file-icon">📄</div>
            <div class="file-details">
              <div class="file-name"></div>
              <div class="file-size"></div>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-primary">
          <span>▶ Compress File</span>
        </button>
      </form>

      <!-- Progress Section -->
      <section class="progress-section" id="progressSection" style="display: none">
        <div class="progress-header">
          <span class="progress-label">Processing</span>
          <span class="progress-percent">0%</span>
        </div>
        <div class="progress">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </section>

      <!-- Status Section -->
      <section class="status-section" id="statusSection" style="display: none">
        <div class="status-card">
          <div class="status-badge" id="statusBadge"></div>
          <div class="status-message" id="statusMessage"></div>
        </div>
      </section>

      <!-- Download Section -->
      <section class="download-section" id="downloadSection" style="display: none">
        <a href="#" class="btn-download" id="downloadBtn" download>
          <span>↓ Download Optimized File</span>
        </a>
      </section>

      <!-- Error Section -->
      <section class="error-section" id="errorSection" style="display: none">
        <div class="error-card">
          <div class="error-mark">!</div>
          <div class="error-message" id="errorMessage"></div>
        </div>
      </section>

      <!-- Footer -->
      <footer class="footer">
        <p>Supports: JPG · PNG · MP4 · AVI · MOV · MKV · PDF</p>
      </footer>
    </main>

    <script src="/static/script.js?v=2"></script>
  </body>
</html>
